<script>
/*
  Collapse the CMS block wrapper around this hidden snippet.
*/
(function () {
  var el = document.currentScript && document.currentScript.parentElement;
  if (!el || el === document.body) return;

  while (el !== document.body) {
    var p = el.parentElement;
    if (!p || p === document.body) {
      el.style.cssText = 'display:none!important;height:0!important;min-height:0!important;padding:0!important;margin:0!important;overflow:hidden!important;';
      break;
    }
    if (p.children.length > 1) {
      el.style.cssText = 'display:none!important;height:0!important;min-height:0!important;padding:0!important;margin:0!important;overflow:hidden!important;';
      break;
    }
    el = p;
  }
}());
</script>

<!--
  SNIPPET 3 — Translations / i18n
  =================================
  Paste this as the FIRST HTML block on the shop page in mindcms,
  BEFORE snippet 1 (cart engine) and snippet 2 (product gallery).

  Exposes:
    window.mtsT(key)           — translate a key in the active language
    window.mtsSetLang(code)    — change language, persist, fire 'mts-lang-change' event
    window.mtsLang             — currently active language code
    window.mtsLangs            — array of { code, flag, label } for building selectors
    window.mtsI18n             — the raw translations object

  The active language is auto-detected:
    1. localStorage key 'mts_lang' (user preference)
    2. Browser language (navigator.language)
    3. Falls back to 'en'

  To add more languages:
    1. Add a new block inside TRANSLATIONS below
    2. Add an entry to the LANGUAGES array
-->
<script>
(function () {

    { code: 'nl', flag: '🇳🇱', label: 'Nederlands' },
    { code: 'en', flag: '🇬🇧', label: 'English'    },
    /* { code: 'de', flag: '🇩🇪', label: 'Deutsch'    } */
  ];

  /* ── TRANSLATIONS ── */
  var TRANSLATIONS = {

    /* ─── Dutch ─── */
    nl: {
      cart_title:       'Winkelwagen',
      close_cart:       'Sluit winkelwagen',
      open_cart:        'Open winkelwagen',

    /* ─── English ─── */
    en: {

      open_cart:        'Open cart',
      subtotal:         'Subtotal',
      checkout:         'Check out',
      cart_empty:       'Your cart is empty \u2014 explore our crispy seed products!',
      loading:          'Loading\u2026',

      decrease_qty:     'Decrease quantity',
      increase_qty:     'Increase quantity',
      min_qty_notice:   'Add at least 6 products, or a bundle, to proceed to checkout.',
      all_products:     '\u2190 All products',
      loading_products: 'Loading products\u2026',
      no_products:      'No products found.',
      load_error:       'Could not load products. Please refresh the page.',
      no_description:   'No description available.',
      add_to_cart:      '+ add to cart',
      adding:           'Adding\u2026',
      added:            '\u2713 Added!',
      error_retry:      'Error \u2014 retry',

    /* ─── German ─── */
    de: {
      cart_title:       'Warenkorb',
      close_cart:       'Warenkorb schlie\u00dfen',
      open_cart:        'Warenkorb \u00f6ffnen',
      subtotal:         'Zwischensumme',

      no_description:   'Keine Beschreibung verf\u00fcgbar.',
      add_to_cart:      '+ in den Warenkorb',

      added:            '\u2713 Hinzugef\u00fcgt!',
      error_retry:      'Fehler \u2014 erneut',
      try_again:        'Erneut versuchen',
      sold_out:         'Ausverkauft',
      see_more:         'mehr sehen \u2192',
      open_in_store:    'im Shop \u00f6ffnen \u2197'
    }
  };

  /* ── Language detection: localStorage → browser → 'nl' ── */
  function detectLang() {
    var saved = localStorage.getItem('mts_lang');
    if (saved && TRANSLATIONS[saved]) return saved;
    var browser = (navigator.language || '').split('-')[0].toLowerCase();
    if (TRANSLATIONS[browser]) return browser;
    return 'en';
  }

  window.mtsI18n  = TRANSLATIONS;
  window.mtsLangs = LANGUAGES;
  window.mtsLang  = detectLang();

  /** Translate a key in the currently active language */
  window.mtsT = function (key) {
    var dict = TRANSLATIONS[window.mtsLang] || TRANSLATIONS.nl;
    return (dict && dict[key] != null) ? dict[key] : key;
  };

  /** Change the active language, persist to localStorage, fire 'mts-lang-change' event */
  window.mtsSetLang = function (code) {
    if (!TRANSLATIONS[code]) return;
    window.mtsLang = code;
    localStorage.setItem('mts_lang', code);
    document.dispatchEvent(new CustomEvent('mts-lang-change', { detail: { lang: code } }));
  };
}());
</script>
